name: 🤖 Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build AnimaAI APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Vite App
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VITE_HF_API_KEY: ${{ secrets.HF_API_KEY }}

      - name: 📲 Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🔧 Capacitor Init (if needed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 🔄 Capacitor Sync
        run: npx cap sync android

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant Gradle Permission
        run: chmod +x android/gradlew

      - name: 🏭 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimaAI-Studio-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (on tag)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AnimaAI Studio ${{ github.ref_name }}
          body: |
            ## 🎬 AnimaAI Studio Release
            
            ### Features:
            - ✅ 3 AI API Auto Rotation (Gemini → Groq → HuggingFace)
            - ✅ 2D Character Animation Engine
            - ✅ Script Editor (AI + Manual)
            - ✅ 6 Scene Themes
            - ✅ HD Video Export
            
            ### Install:
            1. Download APK below
            2. Enable "Unknown Sources" on Android
            3. Install & Enter API Keys in Settings
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
